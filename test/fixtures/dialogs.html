<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
<h1 id="out">대기</h1>
<button id="del">삭제</button>
<button id="note">알림</button>
<script>
  const out = document.getElementById('out')
  document.getElementById('del').addEventListener('click', () => {
    out.textContent = confirm('정말 삭제할까요?') ? '삭제됨' : '취소됨'
  })
  document.getElementById('note').addEventListener('click', () => {
    alert('저장했습니다')
    out.textContent = '알림 닫힘'
  })
</script>
</body></html>
