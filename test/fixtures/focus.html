<!DOCTYPE html><html><head><meta charset="utf-8"><title>Focus</title></head>
<body>
<input id="a"><input id="b">
<script>
  window.__ev = []
  for (const id of ['a', 'b']) {
    const el = document.getElementById(id)
    el.addEventListener('focus', () => __ev.push('focus:' + id))
    el.addEventListener('blur', () => __ev.push('blur:' + id))
  }
  window.addEventListener('focus', () => __ev.push('window-focus'))
  window.addEventListener('blur', () => __ev.push('window-blur'))
</script>
</body></html>
